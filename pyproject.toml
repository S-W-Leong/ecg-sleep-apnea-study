[project]
name = "apnea-det-ecg-notebooks"
version = "0.1.0"
description = "Notebook-based ECG sleep apnea study"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "matplotlib>=3.9,<4",
  "wfdb>=4.2,<5",
  "scikit-learn>=1.6,<2",
  "xgboost>=2.1,<4",
  "joblib>=1.4,<2",
  "torch>=2.5,<3",
]

[dependency-groups]
dev = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbconvert>=7,<8", "pytest>=8,<10", "ruff>=0.9,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
